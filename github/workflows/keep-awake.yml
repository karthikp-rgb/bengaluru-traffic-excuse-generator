# Keeps the Streamlit app from going to sleep.
# Streamlit Community Cloud puts apps to sleep after 12 hours without visitors.
# This opens the app in a real browser every 3 hours and clicks
# "Yes, get this app back up!" if the app has fallen asleep.

name: Keep app awake

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (times are in UTC)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

env:
  # 👇 Change this to your app's link if you rename it
  APP_URL: "https://bengaluru-traffic-excuse-generator-epvbi8m4jymb3ocrsa4ehc.streamlit.app/"

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit the app (and wake it if asleep)
        run: |
          cat > visit.py <<'PY'
          import os, re, sys
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          wake_text = re.compile("get this app back up", re.I)

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1280, "height": 900})
              print(f"Opening {url}")
              page.goto(url, wait_until="domcontentloaded", timeout=90_000)
              page.wait_for_timeout(15_000)

              button = page.get_by_role("button", name=wake_text)
              if button.count() > 0:
                  print("😴 App was asleep. Clicking the wake-up button...")
                  button.first.click()
                  page.wait_for_timeout(90_000)  # give it time to boot
              else:
                  print("✅ App is awake.")

              page.screenshot(path="app.png", full_page=True)
              still_asleep = page.get_by_role("button", name=wake_text).count() > 0
              browser.close()

          if still_asleep:
              print("❌ App still looks asleep. Check the screenshot in this run's artifacts.")
              sys.exit(1)
          print("Done.")
          PY
          python visit.py

      - name: Save a screenshot (for checking)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: app.png
          retention-days: 3
